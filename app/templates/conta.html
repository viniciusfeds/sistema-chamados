{% extends "base.html" %}
{% block titulo %}Minha conta{% endblock %}
{% block conteudo %}
<h1>Minha conta</h1>
<div class="card" style="max-width:480px">
  <p><b>{{ u.nome }}</b><br><span class="muted">{{ u.email }} · {{ PAPEIS[u.papel] }}{% if u.unidade %} · {{ u.unidade.nome }}{% endif %}</span></p>
  <form method="post" action="/conta">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="campo"><label>Senha atual</label><input type="password" name="atual" required autocomplete="current-password"></div>
    <div class="campo"><label>Nova senha</label><input type="password" name="nova" minlength="8" required autocomplete="new-password"></div>
    <button class="btn">Trocar senha</button>
  </form>
</div>
{% endblock %}
