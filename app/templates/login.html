{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login card">
  <img src="/static/logo.png" alt="{{ config.EMPRESA_NOME }}">
  <h1 class="login-nome">{{ config.SISTEMA_NOME }}</h1>
  <p class="muted" style="text-align:center;margin-top:0">Gestão de chamados técnicos · por {{ config.EMPRESA_NOME }}</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="campo"><label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="campo"><label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;justify-content:center">Entrar</button>
  </form>
  <div id="bloco-chave" hidden>
    <div class="ou"><span>ou</span></div>
    <button type="button" class="btn sec btn-bio" id="btn-chave" style="width:100%;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M12 10v3h-1M9.5 15.5c1.4 1 3.6 1 5 0"/></svg>
      Entrar com reconhecimento facial</button>
    <p class="dica" style="text-align:center;margin:8px 0 0">Face ID, digital ou Windows Hello — cadastre o aparelho em Minha conta.</p>
    <p class="dica" id="erro-chave" style="color:#B3261E;text-align:center" hidden></p>
  </div>
</div>
<script src="/static/chave.js?v={{ config.VERSAO }}"></script>
<script>
(function () {
  if (!Chave.suportado()) return;
  document.getElementById('bloco-chave').hidden = false;
  var b = document.getElementById('btn-chave'), err = document.getElementById('erro-chave');
  b.onclick = function () {
    err.hidden = true; b.disabled = true;
    fetch('/login/chave/opcoes', {method: 'POST', body: new URLSearchParams({csrf: '{{ csrf }}'}), credentials: 'same-origin'})
      .then(function (r) { return r.json(); })
      .then(Chave.obter)
      .then(function (cred) { return Chave.postar('/login/chave', {csrf: '{{ csrf }}', next: {{ next|tojson }}, credencial: JSON.stringify(cred)}); })
      .then(function (j) { if (j.ok) location.href = j.ir; else { err.textContent = j.erro; err.hidden = false; b.disabled = false; } })
      .catch(function (e) { err.textContent = Chave.mensagemErro(e); err.hidden = false; b.disabled = false; });
  };
})();
</script>
{% endblock %}
