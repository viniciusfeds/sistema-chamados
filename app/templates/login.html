{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login card">
  <img src="/static/logo.png" alt="{{ config.EMPRESA_NOME }}">
  <h1 style="text-align:center;font-size:1.4rem">Sistema de Chamados</h1>
  <p class="muted" style="text-align:center;margin-top:0">{{ config.EMPRESA_NOME }} · Soluções em Tecnologia</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="campo"><label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="campo"><label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;justify-content:center">Entrar</button>
  </form>
</div>
{% endblock %}
