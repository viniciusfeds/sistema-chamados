<script>
(function () {
  document.querySelectorAll('canvas.rubrica').forEach(function (cv) {
    var form = cv.closest('form'), dado = form.querySelector('.rubrica-dado'), ctx = cv.getContext('2d'), riscou = false, des = false;
    function ajustar() { var r = cv.getBoundingClientRect(), img = riscou ? cv.toDataURL() : null;
      cv.width = Math.round(r.width * 2); cv.height = Math.round(r.height * 2); ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b2a4a';
      if (img) { var i = new Image(); i.onload = function () { ctx.drawImage(i, 0, 0, cv.width, cv.height); }; i.src = img; } }
    function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
    cv.addEventListener('pointerdown', function (e) { des = true; riscou = true; cv.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); e.preventDefault(); });
    cv.addEventListener('pointermove', function (e) { if (!des) return; var p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); e.preventDefault(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cv.addEventListener(ev, function () { des = false; }); });
    var lb = form.querySelector('.limpar-rubrica');
    if (lb) lb.onclick = function () { ctx.clearRect(0, 0, cv.width, cv.height); riscou = false; };
    form.addEventListener('submit', function () { if (dado) dado.value = riscou ? cv.toDataURL('image/png') : ''; });
    ajustar(); window.addEventListener('resize', ajustar);
  });
})();
</script>
